[project]
name = "losspeaker"
version = "0.1.0"
description = "A Raspberry Pi music player and network receiver"
requires-python = ">=3.13"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "httpx>=0.28,<1", "python-mpd2>=3.1,<4", "dbus-next>=0.2.3,<1", "numpy>=2.2,<3", "PyYAML>=6,<7", "websockets>=15,<17", "python-multipart>=0.0.20,<1"]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build]
dev-mode-dirs = ["backend"]
[tool.hatch.build.targets.wheel]
packages = ["backend/losspeaker"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["backend/tests"]
