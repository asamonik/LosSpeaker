device_name: LosSpeaker
device_type: speaker
audio_backend: pulseaudio
audio_device: losspeaker.spotify
# Request Spotify's highest supported Vorbis bitrate instead of the 160 default.
bitrate: 320
zeroconf_enabled: true
credentials:
  type: zeroconf
  zeroconf:
    persist_credentials: true
server:
  enabled: true
  address: 127.0.0.1
  port: 3678
