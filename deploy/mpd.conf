music_directory "/srv/losspeaker/music"
playlist_directory "/var/lib/losspeaker/playlists"
db_file "/var/lib/losspeaker/mpd.db"
state_file "/var/lib/losspeaker/mpd.state"
sticker_file "/var/lib/losspeaker/stickers.db"
bind_to_address "127.0.0.1"
port "6600"
auto_update "no"
follow_outside_symlinks "no"
audio_output {
 type "pulse"
 name "Processed"
 sink "losspeaker.mpd"
 mixer_type "none"
}
audio_output {
 type "alsa"
 name "Direct"
 device "hw:CARD=Unconfigured,DEV=0"
 mixer_type "none"
 dop "no"
 auto_resample "no"
 auto_channels "no"
 auto_format "no"
 enabled "no"
}
