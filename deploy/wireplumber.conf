wireplumber.profiles = { main = { monitor.alsa = disabled monitor.bluez.seat-monitoring = disabled monitor.bluez-midi = disabled } }
monitor.bluez.properties = { bluez5.roles = [ a2dp_sink ] bluez5.codecs = [ sbc aac ] bluez5.hfphsp-backend = none }
monitor.bluez.rules = [
 { matches = [ { node.name = "~bluez_input.*" } ] actions = { update-props = { target.object = "losspeaker.bluetooth" node.dont-fallback = true } } }
]
